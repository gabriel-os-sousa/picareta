; =========================================================
; ATALHOS DA PICARETA
; =========================================================
;
; Sintaxe utilizada pelo AutoHotkey:
; ^ = Ctrl
; ! = Alt
; + = Shift
; # = tecla Windows
;
; Exemplos:
; Ctrl + F3        = ^F3
; Ctrl + Alt + F12 = ^!F12
; Shift + F5       = +F5
;
; Alguns nomes de botões do mouse:
; MButton  = botão do meio
; XButton1 = botão lateral traseiro
; XButton2 = botão lateral dianteiro
;
; Os atalhos podem ser salvos e aplicados diretamente
; pela janela da Picareta.

[Setup]
; 0 = primeira inicialização. Passa para 1 ao salvar os atalhos.
HotkeysConfigured=0

[Hotkeys]
; Nenhum atalho é preenchido automaticamente.
; Configure pela aba Atalhos da janela da Picareta.
RegisterLeader=
RegisterMule=
NextWindow=
ShowStatus=
BuildParty=
RebuildParty=
ToggleMirror=
ClearRegistrations=
ExitController=


[General]
NotificationX=915
NotificationY=140

; Pausa entre o convite de uma mula e a próxima.
InviteDelay=180

; Pausa depois de enviar todos os convites
; e antes de começar os aceites.
BeforeAcceptDelay=50

; Pausa entre o aceite de uma mula e a próxima.
AcceptDelay=100

; Coordenadas iguais em todas as mulas para abrir
; o menu de contexto usado pelo comando Seguir líder.
FollowMenuX=20
FollowMenuY=205

; Coordenadas do item Seguir dentro do menu aberto.
FollowOptionX=60
FollowOptionY=245

; Tempo entre abrir o menu e clicar na opção Seguir.
FollowMenuDelay=150

; Pausa entre processar uma mula e a próxima.
FollowMuleDelay=150

; Coordenadas do botão Expulsar da PT.
KickX=1685
KickY=700

; Coordenadas do botão Transferir liderança.
TransferLeaderX=1765
TransferLeaderY=701

; Coordenadas do botão Sair da PT.
LeavePartyX=1765
LeavePartyY=730

; Tempo entre selecionar a mula e clicar no botão da ação.
PartySelectDelay=100

; Tempo depois de clicar em Expulsar.
PartyKickDelay=50

; Tempo depois de clicar em Transferir liderança.
PartyTransferDelay=300

; Espera adicional antes de clicar em Sair da PT.
PartyBeforeLeaveDelay=400

; Tempo depois de clicar em Sair da PT
; e antes de enviar a confirmação Y.
PartyLeaveDelay=300


; Posições fixas das linhas da lista de membros da PT.
; Não pertencem a uma mula específica. A primeira mula cadastrada
; usa a posição 1, a segunda usa a posição 2 e assim por diante.
; Configure pela aba Remontar PT usando o botão Capturar.
