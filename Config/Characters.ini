; =========================================================
; ATALHOS DO CONTROLLER
; =========================================================
;
; Sintaxe utilizada pelo AutoHotkey:
; ^ = Ctrl
; ! = Alt
; + = Shift
; # = tecla Windows
;
; Exemplos:
; Ctrl + F3        = ^F3
; Ctrl + Alt + F12 = ^!F12
; Shift + F5       = +F5
;
; Alguns nomes de botões do mouse:
; MButton  = botão do meio
; XButton1 = botão lateral traseiro
; XButton2 = botão lateral dianteiro
;
; Depois de alterar qualquer atalho, feche e abra
; novamente o PW Controller.

[Hotkeys]

; Cadastra a janela ativa como personagem principal.
RegisterLeader=F2

; Cadastra a janela ativa como próxima mula.
RegisterMule=F3

; Alterna entre o principal e as mulas cadastradas.
NextWindow=SC029

; Exibe o status dos personagens e configurações.
ShowStatus=F7

; Envia os convites e monta a PT.
BuildParty=XButton1

; Expulsa os membros, transfere a liderança
; e faz o personagem principal sair da PT.
RebuildParty=XButton2

; Atalho opcional para ativar ou desativar o espelhamento.
; Deixe vazio para controlar somente pelo botão da janela.
ToggleMirror=

; Limpa os personagens cadastrados na sessão atual.
ClearRegistrations=^F3

; Fecha completamente o PW Controller.
ExitController=^!F12


[General]
NotificationX=915
NotificationY=140

; Pausa entre o convite de uma mula e a próxima.
InviteDelay=180

; Pausa depois de enviar todos os convites
; e antes de começar os aceites.
BeforeAcceptDelay=50

; Pausa entre o aceite de uma mula e a próxima.
AcceptDelay=100

; Coordenadas do botão Expulsar da PT.
KickX=1685
KickY=700

; Coordenadas do botão Transferir liderança.
TransferLeaderX=1765
TransferLeaderY=701

; Coordenadas do botão Sair da PT.
LeavePartyX=1765
LeavePartyY=730

; Tempo entre selecionar a mula e clicar no botão da ação.
PartySelectDelay=100

; Tempo depois de clicar em Expulsar.
PartyKickDelay=50

; Tempo depois de clicar em Transferir liderança.
PartyTransferDelay=300

; Espera adicional antes de clicar em Sair da PT.
PartyBeforeLeaveDelay=400

; Tempo depois de clicar em Sair da PT
; e antes de enviar a confirmação Y.
PartyLeaveDelay=300

